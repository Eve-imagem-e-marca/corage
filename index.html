<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corage | Raio-X do seu app</title>
<meta name="description" content="Descubra se um app ajuda o seu negócio, veja cases reais e conheça o portfólio da Corage, por Eve, imagem e marca.">
<meta name="theme-color" content="#f7dcd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--rose:#f7dcd9;--rose2:#efc3c0;--rose3:#fbeceb;--marsala:#7a2e3f;--ink:#3a2327;--soft:#5e4447;--line:#ebc9c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--rose);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;color:var(--marsala);letter-spacing:-.01em;line-height:1.15;margin:0 0 12px}
h1{font-size:34px}h2{font-size:27px}h3{font-size:20px}
p{margin:0 0 14px}
.small{font-size:16px;color:var(--soft)}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:260px;height:260px;background:#f2b7b4;top:-60px;right:-80px;animation:drift 18s ease-in-out infinite}
.b2{width:300px;height:300px;background:#fff0ee;bottom:80px;left:-120px;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,40px)}}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(247,220,217,.92);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;font:inherit;color:var(--marsala);font-weight:700;font-size:20px;padding:0;cursor:pointer;font-family:ui-rounded,-apple-system,sans-serif}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--rose3);border:1.5px solid var(--marsala);font-style:normal;font-family:Georgia,serif}
.hbtns{display:flex;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--marsala);background:var(--rose3);color:var(--marsala);display:grid;place-items:center;cursor:pointer;font:inherit;font-weight:700;font-size:18px;padding:0}
.ib svg{width:22px;height:22px}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 18px 120px}
.view>*{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:14px}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .15s}
.tool:active{transform:scale(.98);background:var(--rose3)}
.tool .ic{flex:none;width:48px;height:48px;border-radius:16px;background:var(--rose);color:var(--marsala);display:grid;place-items:center}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font-family:ui-rounded,-apple-system,sans-serif;font-size:19px;color:var(--marsala);line-height:1.2}
.tool span{display:block;font-size:16px;color:var(--soft)}
.tool .ok{margin-left:auto;flex:none;font-size:14px;font-weight:700;color:var(--marsala);background:var(--rose);border-radius:999px;padding:3px 10px}
.primary{display:block;width:100%;text-align:center;background:var(--marsala);color:#fff;border:0;border-radius:999px;padding:16px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.primary[disabled]{opacity:.35}
.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,46,63,.4)}50%{box-shadow:0 0 0 12px rgba(122,46,63,0)}}
.ghost{display:block;width:100%;text-align:center;background:transparent;color:var(--marsala);border:1.5px solid var(--marsala);border-radius:999px;padding:14px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.link{background:none;border:0;font:inherit;font-size:16px;color:var(--marsala);padding:8px 0;cursor:pointer;text-decoration:underline}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer;transition:all .15s}
.opt.on{border-color:var(--marsala);background:var(--rose3);font-weight:600}
.bar{height:8px;background:#fff;border-radius:8px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--marsala);border-radius:8px;transition:width .5s}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tag{display:inline-block;background:#fff;color:var(--marsala);border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:15px;font-weight:600;margin-bottom:10px}
.hero{text-align:left;padding:6px 0 10px}
.badge{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--rose3);border:2px solid var(--marsala);color:var(--marsala);font:700 52px Georgia,serif;margin-bottom:16px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none;width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--rose)}
.ring .fg{stroke:var(--marsala);stroke-linecap:round;transition:stroke-dashoffset 1s}
.acc{background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:16px 20px;font:inherit;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc>button b{display:block;font-family:ui-rounded,-apple-system,sans-serif;font-size:20px;color:var(--marsala);line-height:1.2}
.acc>button span{display:block;font-size:16px;color:var(--soft)}
.acc>button em{flex:none;font-style:normal;font-size:24px;color:var(--marsala);transition:transform .25s}
.acc.open>button em{transform:rotate(45deg)}
.acc .body{display:none;padding:0 20px 18px}
.acc.open .body{display:block;animation:up .3s both}
.fact{border-left:3px solid var(--rose2);padding-left:12px;margin:0 0 12px}
.big{font:700 40px ui-rounded,-apple-system,sans-serif;color:var(--marsala);line-height:1;margin:2px 0 4px}
.src{font-size:16px;color:var(--soft)}
.src a{color:var(--marsala)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -18px 8px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--marsala);background:transparent;color:var(--marsala);border-radius:999px;padding:9px 16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.chip.on{background:var(--marsala);color:#fff}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:12px 8px;font:inherit;font-weight:600;color:var(--marsala);cursor:pointer;transition:all .25s}
.seg button.on{background:var(--marsala);color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rose)}
.list li:last-child{border:0}
.list li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--rose2)}
.list.app li:before{background:var(--marsala)}
.plan h3{margin-bottom:4px}
.price{font-weight:700;color:var(--marsala);margin:8px 0 14px}
input[type=text]{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);background:#fff;margin-bottom:18px}
input[type=text]:focus{outline:none;border-color:var(--marsala)}
label.l{display:block;font-weight:600;color:var(--marsala);margin:6px 0 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--soft);padding:6px 0;cursor:pointer}
.tabs button svg{width:26px;height:26px;transition:transform .2s}
.tabs button.on{color:var(--marsala)}
.tabs button.on svg{transform:translateY(-3px) scale(1.12)}
.wheelwrap{position:relative;width:100%;max-width:340px;margin:6px auto 18px}
.wheelwrap svg{width:100%;display:block}
#wheel{transition:transform 4.2s cubic-bezier(.12,.7,.1,1);transform-origin:50% 50%}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--marsala);z-index:2}
.modal{position:fixed;inset:0;z-index:50;background:rgba(58,35,39,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--rose3);border-radius:28px;padding:24px 22px;max-width:380px;width:100%;text-align:center;animation:up .35s both}
.qrbox{background:#fff;border-radius:20px;padding:18px;margin:0 auto 14px;max-width:290px}
.qrbox svg{display:block;width:100%;height:auto}
footer{margin-top:26px;text-align:center;font-size:16px;color:var(--soft)}
.sp{height:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var t0=null;function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/1100,1);var e=1-Math.pow(1-p,3);n.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function openQR(){document.getElementById("modal").classList.add("on");}

function vQuiz(){
  var i=state.step;if(i>=quiz.length){return vQuizRes();}
  var q=quiz[i],sel=state.answers[i];
  var h=back("Pergunta "+(i+1)+" de "+quiz.length)+'<div class="bar"><i style="width:'+(i/quiz.length*100)+'%"></i></div><h2>'+q.q+'</h2>';
  for(var k=0;k<q.o.length;k++){h+='<button class="opt'+(sel===k?' on':'')+'" onclick="pick('+k+')">'+q.o[k][0]+'</button>';}
  h+='<div class="sp"></div><button class="primary'+(sel!==undefined?' pulse':'')+'" '+(sel===undefined?'disabled':'')+' onclick="nextStep()">'+(i===quiz.length-1?'Ver resultado':'Continuar')+'</button>';
  if(i>0){h+='<div style="text-align:center"><button class="link" onclick="prevStep()">Pergunta anterior</button></div>';}
  app.innerHTML=h;
}
function pick(k){state.answers[state.step]=k;noAnim();render();}
function nextStep(){state.step++;render();window.scrollTo(0,0);}
function prevStep(){state.step--;render();}
function vQuizRes(){
  done("quiz");
  var s=0;for(var i=0;i<quiz.length;i++){s+=quiz[i].o[state.answers[i]][1];}
  var r=quizResults[quizResults.length-1];for(var j=0;j<quizResults.length;j++){if(s<=quizResults[j].max){r=quizResults[j];break;}}
  app.innerHTML=back("Resultado")+'<span class="tag">'+s+' de 12 pontos</span><h2>'+(profile.name?profile.name+', ':'')+r.t.charAt(0).toLowerCase()+r.t.slice(1)+'</h2><p>'+r.p+'</p>'+
   '<p class="small">É uma orientação geral, feita só com as suas respostas. Não é uma análise completa do seu negócio.</p>'+
   '<button class="primary pulse" onclick="go(\'match\')">Ver que app combina com você</button>'+foot();
}

function mg(k){state.match.g=k;noAnim();render();}

function wheelSVG(){
  var n=wheel.length,s='<svg viewBox="0 0 200 200"><g id="wheel">',cols=["#7a2e3f","#f7dcd9"];
  for(var i=0;i<n;i++){
    var a0=(-90+i*360/n)*Math.PI/180,a1=(-90+(i+1)*360/n)*Math.PI/180;
    var x0=100+96*Math.cos(a0),y0=100+96*Math.sin(a0),x1=100+96*Math.cos(a1),y1=100+96*Math.sin(a1);
    var dark=i%2===0;
    s+='<path d="M100 100L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A96 96 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" fill="'+cols[dark?0:1]+'" stroke="#fff" stroke-width="1.5"/>';
    var th=i*360/n+360/n/2;
    var fl=(th>90&&th<270)?' transform="rotate(180 100 37)"':'';s+='<g transform="rotate('+th+' 100 100)"><text x="100" y="40" text-anchor="middle"'+fl+' font-size="10.5" font-weight="700" font-family="ui-rounded,-apple-system,sans-serif" fill="'+(dark?"#fff":"#7a2e3f")+'">'+wheel[i][0]+'</text></g>';
  }
  s+='</g><circle cx="100" cy="100" r="17" fill="#fff" stroke="#7a2e3f" stroke-width="2"/><text x="100" y="108" text-anchor="middle" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#7a2e3f">C</text></svg>';
  return s;
}
function vWheel(){
  var h=back("Roda do conteúdo")+'<h2>Gire e ganhe uma ideia de post</h2><p>Toque em girar. A roda escolhe um formato de conteúdo para você usar hoje.</p>'+
   '<div class="wheelwrap"><div class="pointer"></div>'+wheelSVG()+'</div>'+
   '<button class="primary pulse" id="spinbtn" onclick="spin()">Girar</button><div class="sp"></div><div id="wres"></div>'+foot();
  app.innerHTML=h;
  var w=document.getElementById("wheel");if(w){w.style.transition="none";w.style.transform="rotate("+state.rot+"deg)";}
  showRes();
}
function showRes(){var r=document.getElementById("wres");if(!r||state.spun===null)return;var it=wheel[state.spun];
  r.innerHTML='<div class="card" style="animation:up .4s both"><span class="tag">'+it[0]+'</span><p style="margin:0">'+(profile.area?'Para '+profile.area+': ':'')+it[1]+'</p></div>'+contactBtn("Quero ajuda para criar esse post","Oi, Eve! Caiu \""+it[0]+"\" na roda do conteúdo e quero ajuda.","ghost");}
function spin(){
  if(state.spinning)return;state.spinning=true;
  var i=Math.floor(Math.random()*wheel.length),seg=360/wheel.length;
  var target=(360-(i*seg+seg/2));
  var cur=state.rot%360;var add=((target-cur)%360+360)%360;
  state.rot=state.rot+(reduce?0:1800)+add;
  var w=document.getElementById("wheel"),r=document.getElementById("wres"),b=document.getElementById("spinbtn");
  if(r)r.innerHTML="";if(b)b.textContent="Girando...";
  w.style.transition=reduce?"none":"transform 4.2s cubic-bezier(.12,.7,.1,1)";
  w.getBoundingClientRect();w.style.transform="rotate("+state.rot+"deg)";
  setTimeout(function(){state.spinning=false;state.spun=i;done("wheel");var b2=document.getElementById("spinbtn");if(b2)b2.textContent="Girar de novo";showRes();},reduce?50:4300);
}

  }
  h+='<p class="small">Site e app se completam. O app é o próximo passo para quem quer se aproximar de verdade.</p>'+
   '<h3 style="margin-top:20px">Por que importa para a sua imagem</h3>'+
   acc("Presença todo dia","Cada vez que a pessoa abre o app, vê a sua marca, as suas cores e o seu jeito de falar. É uma presença que o post sozinho não dá.")+
   acc("Confiança na prática","Uma ferramenta útil prova que você é séria, melhor do que só dizer. A pessoa sente o seu cuidado antes de falar com você.")+

   ["medida","Sob medida","Para um projeto maior",["Plataforma pensada para o seu negócio","Conversa para entender o que suas clientes precisam","A gente combina o que entra"]]
  ];
  for(var i=0;i<plans.length;i++){var p=plans[i];

    for(var j=0;j<p[3].length;j++){h+='<li>'+p[3][j]+'</li>';}
    h+='</ul><div class="price">'+(PRICES[p[0]]||"Valor combinado na conversa")+'</div>'+contactBtn("Quero este","Oi, Eve! Quero saber mais sobre o plano "+p[1]+" da Corage."+(profile.area?" Minha área: "+profile.area+".":""),"primary")+'</div>';}
  h+='<h3 style="margin-top:22px">Como funciona</h3><div class="card"><ul class="list app"><li><b>A gente conversa.</b> Você conta o seu trabalho e o que as clientes mais pedem.</li><li><b>Eu desenho o app.</b> Simples, com as suas cores.</li><li><b>Você recebe pronto.</b> Abre no celular, sem baixar nada, e é só mandar o link.</li></ul></div>'+
   '<button class="ghost" onclick="openQR()">Mostrar o QR Code da Corage</button>'+foot();
  app.innerHTML=h;

function acc(t,p){return '<div class="acc" onclick="if(event.target.closest(\'button\')&&!event.target.closest(\'.body\'))toggle(this)"><button><div><b>'+t+'</b></div><em>+</em></button><div class="body"><p style="margin:0">'+p+'</p></div></div>';}
function setCmp(c){state.compare=c;render();}

/* ---------- render ---------- */
var noA=false;function noAnim(){noA=true;}
function render(){
  var v=state.view;
  app.className="view";
  if(v==="home")vHome();else if(v==="profile")vProfile();else if(v==="quiz")vQuiz();else if(v==="match")vMatch();else if(v==="cases")vCases();else if(v==="wheel")vWheel();else if(v==="portfolio")vPortfolio();else if(v==="plans")vPlans();
  var kids=app.children;for(var i=0;i<kids.length;i++){if(noA){kids[i].style.animation="none";}else{kids[i].style.animationDelay=(i*55)+"ms";}}
  noA=false;
  var tab=(v==="portfolio"||v==="plans")?v:"home";
  var bs=document.querySelectorAll("#tabs button");for(var j=0;j<bs.length;j++){bs[j].classList.toggle("on",bs[j].getAttribute("data-t")===tab);}
  var av=document.getElementById("av");av.textContent=profile.name?profile.name.charAt(0).toUpperCase():"·";
}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
