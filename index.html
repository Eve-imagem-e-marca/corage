<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corage | Raio-X do seu app</title>
<meta name="description" content="Descubra se um app ajuda o seu negócio, veja cases reais e conheça o portfólio da Corage, por Eve, imagem e marca.">
<meta name="theme-color" content="#f7dcd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--rose:#f7dcd9;--rose2:#efc3c0;--rose3:#fbeceb;--marsala:#7a2e3f;--ink:#3a2327;--soft:#5e4447;--line:#ebc9c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--rose);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;color:var(--marsala);letter-spacing:-.01em;line-height:1.15;margin:0 0 12px}
h1{font-size:34px}h2{font-size:27px}h3{font-size:20px}
p{margin:0 0 14px}
.small{font-size:16px;color:var(--soft)}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:260px;height:260px;background:#f2b7b4;top:-60px;right:-80px;animation:drift 18s ease-in-out infinite}
.b2{width:300px;height:300px;background:#fff0ee;bottom:80px;left:-120px;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,40px)}}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(247,220,217,.92);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;font:inherit;color:var(--marsala);font-weight:700;font-size:20px;padding:0;cursor:pointer;font-family:ui-rounded,-apple-system,sans-serif}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--rose3);border:1.5px solid var(--marsala);font-style:normal;font-family:Georgia,serif}
.hbtns{display:flex;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--marsala);background:var(--rose3);color:var(--marsala);display:grid;place-items:center;cursor:pointer;font:inherit;font-weight:700;font-size:18px;padding:0}
.ib svg{width:22px;height:22px}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 18px 120px}
.view>*{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:14px}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .15s}
.tool:active{transform:scale(.98);background:var(--rose3)}
.tool .ic{flex:none;width:48px;height:48px;border-radius:16px;background:var(--rose);color:var(--marsala);display:grid;place-items:center}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font-family:ui-rounded,-apple-system,sans-serif;font-size:19px;color:var(--marsala);line-height:1.2}
.tool span{display:block;font-size:16px;color:var(--soft)}
.tool .ok{margin-left:auto;flex:none;font-size:14px;font-weight:700;color:var(--marsala);background:var(--rose);border-radius:999px;padding:3px 10px}
.primary{display:block;width:100%;text-align:center;background:var(--marsala);color:#fff;border:0;border-radius:999px;padding:16px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.primary[disabled]{opacity:.35}
.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,46,63,.4)}50%{box-shadow:0 0 0 12px rgba(122,46,63,0)}}
.ghost{display:block;width:100%;text-align:center;background:transparent;color:var(--marsala);border:1.5px solid var(--marsala);border-radius:999px;padding:14px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.link{background:none;border:0;font:inherit;font-size:16px;color:var(--marsala);padding:8px 0;cursor:pointer;text-decoration:underline}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer;transition:all .15s}
.opt.on{border-color:var(--marsala);background:var(--rose3);font-weight:600}
.bar{height:8px;background:#fff;border-radius:8px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--marsala);border-radius:8px;transition:width .5s}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tag{display:inline-block;background:#fff;color:var(--marsala);border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:15px;font-weight:600;margin-bottom:10px}
.hero{text-align:left;padding:6px 0 10px}
.badge{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--rose3);border:2px solid var(--marsala);color:var(--marsala);font:700 52px Georgia,serif;margin-bottom:16px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none;width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--rose)}
.ring .fg{stroke:var(--marsala);stroke-linecap:round;transition:stroke-dashoffset 1s}
.acc{background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:16px 20px;font:inherit;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc>button b{display:block;font-family:ui-rounded,-apple-system,sans-serif;font-size:20px;color:var(--marsala);line-height:1.2}
.acc>button span{display:block;font-size:16px;color:var(--soft)}
.acc>button em{flex:none;font-style:normal;font-size:24px;color:var(--marsala);transition:transform .25s}
.acc.open>button em{transform:rotate(45deg)}
.acc .body{display:none;padding:0 20px 18px}
.acc.open .body{display:block;animation:up .3s both}
.fact{border-left:3px solid var(--rose2);padding-left:12px;margin:0 0 12px}
.big{font:700 40px ui-rounded,-apple-system,sans-serif;color:var(--marsala);line-height:1;margin:2px 0 4px}
.src{font-size:16px;color:var(--soft)}
.src a{color:var(--marsala)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -18px 8px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--marsala);background:transparent;color:var(--marsala);border-radius:999px;padding:9px 16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.chip.on{background:var(--marsala);color:#fff}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:12px 8px;font:inherit;font-weight:600;color:var(--marsala);cursor:pointer;transition:all .25s}
.seg button.on{background:var(--marsala);color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rose)}
.list li:last-child{border:0}
.list li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--rose2)}
.list.app li:before{background:var(--marsala)}
.plan h3{margin-bottom:4px}
.price{font-weight:700;color:var(--marsala);margin:8px 0 14px}
input[type=text]{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);background:#fff;margin-bottom:18px}
input[type=text]:focus{outline:none;border-color:var(--marsala)}
label.l{display:block;font-weight:600;color:var(--marsala);margin:6px 0 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--soft);padding:6px 0;cursor:pointer}
.tabs button svg{width:26px;height:26px;transition:transform .2s}
.tabs button.on{color:var(--marsala)}
.tabs button.on svg{transform:translateY(-3px) scale(1.12)}
.wheelwrap{position:relative;width:100%;max-width:340px;margin:6px auto 18px}
.wheelwrap svg{width:100%;display:block}
#wheel{transition:transform 4.2s cubic-bezier(.12,.7,.1,1);transform-origin:50% 50%}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--marsala);z-index:2}
.modal{position:fixed;inset:0;z-index:50;background:rgba(58,35,39,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--rose3);border-radius:28px;padding:24px 22px;max-width:380px;width:100%;text-align:center;animation:up .35s both}
.qrbox{background:#fff;border-radius:20px;padding:18px;margin:0 auto 14px;max-width:290px}
.qrbox svg{display:block;width:100%;height:auto}
footer{margin-top:26px;text-align:center;font-size:16px;color:var(--soft)}
.sp{height:10px}
.cv{display:block;width:100%;max-width:340px;margin:0 auto 12px;background:#fff;border:2px solid var(--marsala);border-radius:16px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin:6px 0 14px}
.dpad button{border:1.5px solid var(--marsala);background:#fff;color:var(--marsala);border-radius:16px;font-size:24px;cursor:pointer}
.dpad button:active{background:var(--rose2)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.score{display:flex;justify-content:space-between;font-weight:700;color:var(--marsala);margin-bottom:10px}
.cw{border-collapse:separate;border-spacing:2px;margin:0 auto 14px}
.cw td{width:36px;height:36px;padding:0;position:relative}
.cw td.f{background:#fff;border:1.5px solid var(--marsala);border-radius:6px}
.cw td.f.hl{background:var(--rose2)}
.cw td.ok{background:#e3f2e5}.cw td.no{background:#fbe0de}
.cw input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:700 20px ui-rounded,-apple-system,sans-serif;color:var(--marsala);text-transform:uppercase;padding:0;border-radius:6px;caret-color:transparent}
.cw input:focus{outline:none}
.cw sup{position:absolute;left:3px;top:1px;font-size:11px;font-weight:700;color:var(--soft);pointer-events:none}
select,textarea{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);background:#fff;margin-bottom:18px}
.chk{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;font-size:17px;color:var(--soft)}
.chk input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:#7a2e3f}
.iahb{background:var(--marsala)!important;color:#fff!important;border-color:var(--marsala)!important}
.iafab_old{position:fixed;right:14px;bottom:88px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--marsala);color:#fff;border:0;border-radius:999px;padding:8px 16px 8px 8px;font:inherit;font-weight:700;box-shadow:0 8px 22px rgba(122,46,63,.35);cursor:pointer}
.iafab span,.iaav{width:34px;height:34px;border-radius:50%;background:var(--rose);color:var(--marsala);display:grid;place-items:center;font-family:ui-rounded,Georgia,serif;font-weight:800;flex:none}
.iabox{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;height:78vh;background:var(--rose3);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(58,35,39,.35);display:none;flex-direction:column}
.iabox.on{display:flex;animation:up .3s both}
.iahead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.iahead div:nth-child(2){flex:1}.iahead b{display:block;color:var(--marsala)}.iahead small{color:#6b4a50}
.iamsgs{flex:1;overflow:auto;padding:14px 16px}
.iam{max-width:88%;padding:12px 14px;border-radius:18px;margin-bottom:10px;line-height:1.4}
.ii{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.iu{background:var(--marsala);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.iaact{display:block;margin-top:10px;background:var(--rose);color:var(--marsala);border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.iaopts{padding:8px 16px;max-height:34%;overflow:auto;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.iachip{display:block;text-align:center;text-decoration:none;background:#fff;color:var(--marsala);border:1.5px solid var(--marsala);border-radius:999px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.iachip.main{background:var(--marsala);color:#fff}
.ianame,#iain{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:#fff}
.iaform{display:flex;gap:8px;padding:8px 16px 16px}
.iaform button{background:var(--marsala);color:#fff;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:700}
.nomo *{animation:none!important;transition:none!important}
.cw td.f{background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="blob b1"></div><div class="blob b2"></div>
<header class="hdr">

function count(){return (prog.quiz?1:0)+(prog.match?1:0)+(prog.cases?1:0)+(prog.wheel?1:0);}
function waUrl(msg){return WHATSAPP?"https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg):INSTAGRAM;}
function contactBtn(txt,msg,cls){return '<a class="'+(cls||"primary")+'" href="'+waUrl(msg||"Oi, Eve! Vi o app da Corage e quero conversar.")+'" target="_blank" rel="noopener">'+txt+'</a>';}
function go(v){stopGame();state.view=v;state.step=0;state.answers=[];if(v==="match"){state.match={g:profile.goalIdx};}render();window.scrollTo(0,0);}
function back(title,to){return '<div class="top"><button class="link" onclick="go(\''+(to||"home")+'\')">← Voltar</button><span class="small">'+(title||"")+'</span></div>';}
function foot(){return '<footer>Corage, por Eve, imagem e marca 🤎<br><button class="link" onclick="go(\'privacy\')">Privacidade e segurança</button> · <button class="link" onclick="go(\'access\')">Uso e acessibilidade</button></footer>';}
function toggle(el){var all=document.querySelectorAll(".acc");for(var i=0;i<all.length;i++){if(all[i]===el){all[i].classList.toggle("open");}else{all[i].classList.remove("open");}}
  var c=el.getAttribute("data-big");if(c&&el.classList.contains("open")){runCount(el.querySelector(".num"));}}
function runCount(n){if(!n)return;var to=parseFloat(n.getAttribute("data-to")),dec=parseInt(n.getAttribute("data-dec")),pre=n.getAttribute("data-pre")||"",suf=n.getAttribute("data-suf")||"";
  function fmt(v){return pre+v.toFixed(dec).replace(".",",")+suf;}
  if(reduce){n.textContent=fmt(to);return;}
  var t0=null;function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/1100,1);var e=1-Math.pow(1-p,3);n.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function openQR(){document.getElementById("modal").classList.add("on");}
function closeQR(){document.getElementById("modal").classList.remove("on");}
function shareApp(){if(navigator.share){navigator.share({title:"Corage",text:"Raio-X do seu app, da Corage",url:SITE}).catch(function(){});}else{window.open("https://wa.me/?text="+encodeURIComponent("Conheça o app da Corage: "+SITE),"_blank");}}

  for(var k=0;k<q.o.length;k++){h+='<button class="opt'+(sel===k?' on':'')+'" onclick="pick('+k+')">'+q.o[k][0]+'</button>';}
  h+='<div class="sp"></div><button class="primary'+(sel!==undefined?' pulse':'')+'" '+(sel===undefined?'disabled':'')+' onclick="nextStep()">'+(i===quiz.length-1?'Ver resultado':'Continuar')+'</button>';

function wheelSVG(){
  var n=wheel.length,s='<svg viewBox="0 0 200 200"><g id="wheel">',cols=["#7a2e3f","#f7dcd9"];
  for(var i=0;i<n;i++){
    var a0=(-90+i*360/n)*Math.PI/180,a1=(-90+(i+1)*360/n)*Math.PI/180;
    var x0=100+96*Math.cos(a0),y0=100+96*Math.sin(a0),x1=100+96*Math.cos(a1),y1=100+96*Math.sin(a1);
    var dark=i%2===0;
    s+='<path d="M100 100L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A96 96 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" fill="'+cols[dark?0:1]+'" stroke="#fff" stroke-width="1.5"/>';
    var th=i*360/n+360/n/2;
    var fl=(th>90&&th<270)?' transform="rotate(180 100 37)"':'';s+='<g transform="rotate('+th+' 100 100)"><text x="100" y="40" text-anchor="middle"'+fl+' font-size="10.5" font-weight="700" font-family="ui-rounded,-apple-system,sans-serif" fill="'+(dark?"#fff":"#7a2e3f")+'">'+wheel[i][0]+'</text></g>';
  }
  s+='</g><circle cx="100" cy="100" r="17" fill="#fff" stroke="#7a2e3f" stroke-width="2"/><text x="100" y="108" text-anchor="middle" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#7a2e3f">C</text></svg>';
  return s;
}

function showRes(){var r=document.getElementById("wres");if(!r||state.spun===null)return;var it=wheel[state.spun];
  r.innerHTML='<div class="card" style="animation:up .4s both"><span class="tag">'+it[0]+'</span><p style="margin:0">'+(profile.area?'Para '+profile.area+': ':'')+it[1]+'</p></div>'+contactBtn("Quero ajuda para criar esse post","Oi, Eve! Caiu \""+it[0]+"\" na roda do conteúdo e quero ajuda.","ghost");}
function spin(){
  if(state.spinning)return;state.spinning=true;
  var i=Math.floor(Math.random()*wheel.length),seg=360/wheel.length;
  var target=(360-(i*seg+seg/2));
  var cur=state.rot%360;var add=((target-cur)%360+360)%360;
  state.rot=state.rot+(reduce?0:1800)+add;
  var w=document.getElementById("wheel"),r=document.getElementById("wres"),b=document.getElementById("spinbtn");
  if(r)r.innerHTML="";if(b)b.textContent="Girando...";
  w.style.transition=reduce?"none":"transform 4.2s cubic-bezier(.12,.7,.1,1)";
  w.getBoundingClientRect();w.style.transform="rotate("+state.rot+"deg)";
  setTimeout(function(){state.spinning=false;state.spun=i;done("wheel");var b2=document.getElementById("spinbtn");if(b2)b2.textContent="Girar de novo";showRes();},reduce?50:4300);
}

var G={};
function stopGame(){clearInterval(G.t);clearInterval(G.iv);clearInterval(G.tm);G.t=G.iv=G.tm=null;G.dir=null;G.busy=false;}
document.addEventListener("keydown",function(e){var m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"}[e.key];if(m&&G.dir&&(state.view==="snake"||state.view==="maze")){e.preventDefault();G.dir(m);}});
function dpad(){return '<div class="dpad"><button class="u" onclick="if(G.dir)G.dir(\'u\')" aria-label="Cima">▲</button><button class="l" onclick="if(G.dir)G.dir(\'l\')" aria-label="Esquerda">◀</button><button class="d" onclick="if(G.dir)G.dir(\'d\')" aria-label="Baixo">▼</button><button class="r" onclick="if(G.dir)G.dir(\'r\')" aria-label="Direita">▶</button></div>';}
function swipe(cv){var sx,sy;cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  cv.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24||!G.dir)return;if(Math.abs(dx)>Math.abs(dy)){G.dir(dx>0?"r":"l");}else{G.dir(dy>0?"d":"u");}},{passive:true});}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

var SN=14,FOODS=["🤝","💼","📸","💬"];
function snakeNew(){var dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}],d=dirs[Math.floor(Math.random()*4)],hx=4+Math.floor(Math.random()*(SN-8)),hy=4+Math.floor(Math.random()*(SN-8));
  return {s:[{x:hx,y:hy},{x:hx-d.x,y:hy-d.y},{x:hx-2*d.x,y:hy-2*d.y}],d:d};}
function vSnake(){
  var best=ls("cg_best_snake")||0;
  app.innerHTML=back("Cobrinha","games")+'<div class="score"><span>Pontos: <b id="sc">0</b></span><span>Recorde: <b id="bs">'+best+'</b></span></div><canvas id="cv" class="cv" width="320" height="320"></canvas>'+dpad()+'<button class="primary pulse" id="go" onclick="snakeStart()">Jogar</button><div id="res" style="margin-top:12px"></div><p class="small" style="margin-top:12px">Sem medo: a cobrinha atravessa as bordas. Só não bata em você mesma. Cada jogo começa de um jeito diferente.</p>'+foot();
  var cv=document.getElementById("cv");swipe(cv);var n=snakeNew();snakeDraw(cv,n.s,{x:Math.floor(Math.random()*SN),y:Math.floor(Math.random()*SN)},FOODS[0]);

function snakeDraw(cv,s,f,emo){var x=cv.getContext("2d"),S=cv.width/SN;x.fillStyle="#fff";x.fillRect(0,0,320,320);
  x.fillStyle="#fbeceb";for(var i=0;i<SN;i++)for(var j=0;j<SN;j++){if((i+j)%2===0)x.fillRect(i*S,j*S,S,S);}
  x.fillStyle="#f7dcd9";x.beginPath();x.arc(f.x*S+S/2,f.y*S+S/2,S*.46,0,7);x.fill();x.font=Math.round(S*.7)+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(emo,f.x*S+S/2,f.y*S+S/2+1);
  for(var k=s.length-1;k>=0;k--){x.fillStyle=k===0?"#5b1f2d":"#7a2e3f";rr(x,s[k].x*S+1.5,s[k].y*S+1.5,S-3,S-3,6);x.fill();}}
function snakeStart(){
  stopGame();document.getElementById("res").innerHTML="";var gb=document.getElementById("go");gb.classList.remove("pulse");gb.style.display="none";
  var cv=document.getElementById("cv"),n=snakeNew(),s=n.s,d=n.d,nd=d,sc=0,speed=260,f,emo=FOODS[0];
  function food(){var p;do{p={x:Math.floor(Math.random()*SN),y:Math.floor(Math.random()*SN)};}while(s.some(function(q){return q.x===p.x&&q.y===p.y;}));return p;}
  f=food();
  G.dir=function(k){var m={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[k];if(m.x===-d.x&&m.y===-d.y)return;nd=m;};
  function end(){stopGame();var best=ls("cg_best_snake")||0;if(sc>best){best=sc;ls("cg_best_snake",best);}addPts(sc);
    document.getElementById("bs").textContent=best;var b=document.getElementById("go");b.style.display="block";b.textContent="Jogar de novo";
    document.getElementById("res").innerHTML='<div class="card"><b>Fim de jogo.</b> Você fez '+sc+' pontos.</div>'+contactBtn("Quero um app com jogos","Oi, Eve! Joguei a cobrinha e quero um app com jogos para o meu negócio.","ghost");}
  function tick(){d=nd;var h={x:(s[0].x+d.x+SN)%SN,y:(s[0].y+d.y+SN)%SN};
    if(s.some(function(q){return q.x===h.x&&q.y===h.y;})){end();return;}
    s.unshift(h);if(h.x===f.x&&h.y===f.y){sc++;document.getElementById("sc").textContent=sc;f=food();emo=FOODS[Math.floor(Math.random()*FOODS.length)];
      if(sc%6===0&&speed>140){speed-=20;clearInterval(G.t);G.t=setInterval(tick,speed);}}else{s.pop();}
    snakeDraw(cv,s,f,emo);}
  G.snake=function(){return {s:s,f:f,sc:sc,speed:speed};};
  G.t=setInterval(tick,speed);snakeDraw(cv,s,f,emo);

function vMaze(){
  app.innerHTML=back("Labirinto","games")+'<div class="score"><span>Fase <b id="lv">1</b></span><span>Tempo: <b id="tm">0</b>s</span></div><canvas id="cv" class="cv" width="320" height="320"></canvas>'+dpad()+'<div id="res"></div>'+foot();
  swipe(document.getElementById("cv"));mazeStart(1);

function mazeGen(n){var T=2*n+1,g=[],i;for(i=0;i<T;i++){g.push([]);for(var j=0;j<T;j++)g[i].push(1);}
  var st=[[1,1]];g[1][1]=0;
  while(st.length){var c=st[st.length-1],ds=[[0,-2],[0,2],[-2,0],[2,0]].sort(function(){return Math.random()-.5;}),mv=false;
    for(var q=0;q<4;q++){var nx=c[0]+ds[q][0],ny=c[1]+ds[q][1];
      if(nx>0&&ny>0&&nx<T-1&&ny<T-1&&g[ny][nx]===1){g[c[1]+ds[q][1]/2][c[0]+ds[q][0]/2]=0;g[ny][nx]=0;st.push([nx,ny]);mv=true;break;}}
    if(!mv)st.pop();}
  return g;}
function mazeStart(lvl){
  stopGame();
  var n=Math.min(4+lvl,9),T=2*n+1,g=mazeGen(n),p={x:1,y:1},ex={x:T-2,y:T-2},cv=document.getElementById("cv"),x=cv.getContext("2d"),S=cv.width/T,sec=0,busy=false;
  document.getElementById("lv").textContent=lvl;document.getElementById("tm").textContent=0;document.getElementById("res").innerHTML="";
  var V={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
  function open(a,b){return a>=0&&b>=0&&a<T&&b<T&&g[b][a]===0;}
  function draw(){x.fillStyle="#fff";x.fillRect(0,0,320,320);x.fillStyle="#7a2e3f";
    for(var j=0;j<T;j++)for(var i=0;i<T;i++){if(g[j][i]===1)x.fillRect(i*S,j*S,S+.5,S+.5);}
    x.fillStyle="#7a2e3f";x.font="700 "+Math.round(S*1.3)+"px Georgia,serif";x.textAlign="center";x.textBaseline="middle";x.fillText("★",ex.x*S+S/2,ex.y*S+S/2+1);
    badge(x,p.x*S+S/2,p.y*S+S/2,S*.46);}
  function win(){clearInterval(G.tm);var pt=10*lvl;addPts(pt);G.dir=null;
    document.getElementById("res").innerHTML='<div class="card"><b>Fase '+lvl+' concluída em '+sec+'s.</b> Você ganhou '+pt+' pontos.</div><button class="primary pulse" onclick="mazeStart('+(lvl+1)+')">Próxima fase</button>';}
  G.dir=function(k){if(busy)return;var v=V[k];if(!open(p.x+v.x,p.y+v.y))return;busy=true;var cur=v;
    G.iv=setInterval(function(){p.x+=cur.x;p.y+=cur.y;draw();
      if(p.x===ex.x&&p.y===ex.y){clearInterval(G.iv);busy=false;win();return;}
      var nx=[];for(var kk in V){var dd=V[kk];if(dd.x===-cur.x&&dd.y===-cur.y)continue;if(open(p.x+dd.x,p.y+dd.y))nx.push(dd);}
      if(nx.length===1){cur=nx[0];}else{clearInterval(G.iv);busy=false;}},45);};
  G.maze=function(){return {g:g,p:p,ex:ex,busy:busy};};
  G.tm=setInterval(function(){sec++;document.getElementById("tm").textContent=sec;},1000);
  draw();
}

var BIZ=["🤝","💼","📸","💬"];
function vBiz(){
  app.innerHTML=back("Empreendedora","games")+'<div class="score"><span>Fase <b id="lv">1</b></span><span>Vidas: <b id="lf">3</b></span></div><canvas id="cv" class="cv" width="320" height="320"></canvas>'+dpad()+
   '<div class="card"><p style="margin:0">Leve o <b>C</b> até 🤝 parcerias, 💼 negócios, 📸 posts e 💬 clientes. Fuja do ⏰ prazo e do ⚠️ imprevisto. Toque numa seta para começar.</p></div><div id="res"></div>'+foot();
  swipe(document.getElementById("cv"));bizStart(1,3);

function bizStart(lvl,lives){
  stopGame();
  var T=15,g=mazeGen(7),i,k;
  for(k=0;k<16;k++){var rx=1+Math.floor(Math.random()*(T-2)),ry=1+Math.floor(Math.random()*(T-2));
    if(g[ry][rx]===1){var hz=g[ry][rx-1]===0&&g[ry][rx+1]===0&&g[ry-1][rx]===1&&g[ry+1][rx]===1,vt=g[ry-1][rx]===0&&g[ry+1][rx]===0&&g[ry][rx-1]===1&&g[ry][rx+1]===1;if(hz||vt)g[ry][rx]=0;}}
  var cv=document.getElementById("cv"),x=cv.getContext("2d"),S=cv.width/T,free=[];
  for(var j=0;j<T;j++)for(i=0;i<T;i++){if(g[j][i]===0&&Math.abs(i-1)+Math.abs(j-1)>3)free.push({x:i,y:j});}
  free.sort(function(){return Math.random()-.5;});
  var p={x:1,y:1},cur={x:0,y:0},want=null,started=false,tc=0,items=[],cnt=Math.min(6+lvl,12);
  for(i=0;i<cnt;i++){items.push({x:free[i].x,y:free[i].y,t:BIZ[i%BIZ.length]});}
  var starts=[{x:T-2,y:T-2},{x:T-2,y:1},{x:1,y:T-2}],ne=lvl<2?1:(lvl<4?2:3),es=[];
  function resetEnemies(){es=[];for(var q=0;q<ne;q++){es.push({x:starts[q].x,y:starts[q].y,d:{x:0,y:0},t:q%2?"⚠️":"⏰"});}}
  resetEnemies();
  var V={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
  document.getElementById("lv").textContent=lvl;document.getElementById("lf").textContent=lives;document.getElementById("res").innerHTML="";
  function open(a,b){return a>=0&&b>=0&&a<T&&b<T&&g[b][a]===0;}
  function draw(){x.fillStyle="#fff";x.fillRect(0,0,320,320);x.fillStyle="#7a2e3f";
    for(var b=0;b<T;b++)for(var a=0;a<T;a++){if(g[b][a]===1)x.fillRect(a*S,b*S,S+.5,S+.5);}
    x.font=Math.round(S*.78)+"px sans-serif";x.textAlign="center";x.textBaseline="middle";
    items.forEach(function(it){x.fillText(it.t,it.x*S+S/2,it.y*S+S/2+1);});
    es.forEach(function(e){x.fillText(e.t,e.x*S+S/2,e.y*S+S/2+1);});
    badge(x,p.x*S+S/2,p.y*S+S/2,S*.46);}
  function hit(){return es.some(function(e){return e.x===p.x&&e.y===p.y;});}
  function lose(){lives--;document.getElementById("lf").textContent=lives;
    if(lives<=0){stopGame();document.getElementById("res").innerHTML='<div class="card"><b>Fim de jogo.</b> Dá para tentar de novo.</div><button class="primary pulse" onclick="bizStart(1,3)">Jogar de novo</button>'+contactBtn("Quero um app com jogos","Oi, Eve! Joguei o labirinto da empreendedora e quero um app com jogos para o meu negócio.","ghost");return true;}
    p.x=1;p.y=1;cur={x:0,y:0};want=null;resetEnemies();draw();return false;}
  function win(){stopGame();addPts(20);document.getElementById("res").innerHTML='<div class="card"><b>Fase '+lvl+' concluída.</b> Você ganhou 20 pontos.</div><button class="primary pulse" onclick="bizStart('+(lvl+1)+','+lives+')">Próxima fase</button>';}
  function moveEnemies(){es.forEach(function(e){var opts=[],kk;
    for(kk in V){var dd=V[kk];if(open(e.x+dd.x,e.y+dd.y)&&!(dd.x===-e.d.x&&dd.y===-e.d.y))opts.push(dd);}
    if(!opts.length){for(kk in V){var d2=V[kk];if(open(e.x+d2.x,e.y+d2.y))opts.push(d2);}}
    var c;if(Math.random()<.55){opts.sort(function(a,b){return (Math.abs(e.x+a.x-p.x)+Math.abs(e.y+a.y-p.y))-(Math.abs(e.x+b.x-p.x)+Math.abs(e.y+b.y-p.y));});c=opts[0];}else{c=opts[Math.floor(Math.random()*opts.length)];}
    if(c){e.d=c;e.x+=c.x;e.y+=c.y;}});}
  function tick(){
    if(want&&open(p.x+want.x,p.y+want.y)){cur=want;}
    if(open(p.x+cur.x,p.y+cur.y)){p.x+=cur.x;p.y+=cur.y;}
    for(var q=items.length-1;q>=0;q--){if(items[q].x===p.x&&items[q].y===p.y){items.splice(q,1);addPts(5);}}
    if(hit()&&lose())return;
    tc++;if(lvl<3?tc%2===0:tc%3!==0){moveEnemies();if(hit()&&lose())return;}
    draw();if(items.length===0){win();}}
  G.dir=function(kk){want=V[kk];if(!started){started=true;G.t=setInterval(tick,170);}};
  G.biz=function(){return {items:items,p:p,es:es,g:g,lives:lives};};
  draw();
}

/* Palavras cruzadas (sorteadas a cada jogo) */
var CWB=[["MARCA","Nome, cores e jeito de falar do seu negócio"],["APP","Programa que fica no celular, com o seu ícone"],["LINK","Endereço que você manda para abrir o app"],["QUIZ","Teste de perguntas rápidas"],["CLIENTE","Quem contrata ou compra o seu trabalho"],["LOGO","Símbolo que identifica a marca"],["FEED","Onde ficam as suas publicações no Instagram"],["CORES","Marsala e rosé são as da Corage"],["IMAGEM","O que as pessoas veem e sentem sobre você"],["POST","Publicação nas redes"],["CADASTRO","Registro do contato de quem se interessou"],["REELS","Vídeos curtos do Instagram"],["PARCERIA","Quando duas profissionais trabalham juntas"],["NEGOCIO","O trabalho que você faz e vende"],["META","Objetivo que você quer alcançar"],["VENDA","Quando alguém compra de você"],["BIO","Texto curto no topo do perfil"],["CELULAR","Aparelho onde o app abre"],["AGENDA","Onde ficam os seus horários"],["STORIES","Publicações do Instagram que somem em 24 horas"],["CONTATO","Como a cliente fala com você"],["NOME","Como o seu negócio é chamado"]];
function cwGen(){
  var N=9,best=null,t;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function can(grid,w,r,c,d){var dr=d==="A"?0:1,dc=d==="A"?1:0,er=r+dr*w.length,ec=c+dc*w.length;
    if(r<0||c<0||er>N||ec>N)return 0;
    if(d==="A"?(c>0&&grid[r+","+(c-1)]):(r>0&&grid[(r-1)+","+c]))return 0;
    if(grid[er+","+ec])return 0;
    var cross=0;
    for(var i=0;i<w.length;i++){var a=r+dr*i,b=c+dc*i,ex=grid[a+","+b];
      if(ex){if(ex.ch!==w.charAt(i)||ex.dirs.indexOf(d)>=0)return 0;cross++;}
      else if(d==="A"){if(grid[(a-1)+","+b]||grid[(a+1)+","+b])return 0;}
      else{if(grid[a+","+(b-1)]||grid[a+","+(b+1)])return 0;}}
    return cross;}
  function put(grid,w,r,c,d){var dr=d==="A"?0:1,dc=d==="A"?1:0;for(var i=0;i<w.length;i++){var key=(r+dr*i)+","+(c+dc*i);if(grid[key]){grid[key].dirs.push(d);}else{grid[key]={ch:w.charAt(i),dirs:[d]};}}}
  for(t=0;t<260;t++){
    var ws=shuffle(CWB.slice()).slice(0,12),grid={},placed=[],first=ws[0],fr=Math.floor(Math.random()*N),fc=Math.floor(Math.random()*(N-first[0].length+1));
    put(grid,first[0],fr,fc,"A");placed.push({a:first[0],c:first[1],r:fr,k:fc,d:"A"});
    for(var q=1;q<ws.length;q++){var w=ws[q][0],opts=[];
      for(var dd=0;dd<2;dd++){var d=dd?"D":"A";for(var r=0;r<N;r++)for(var c=0;c<N;c++){if(can(grid,w,r,c,d)>0)opts.push([r,c,d]);}}
      if(!opts.length)continue;var o=opts[Math.floor(Math.random()*opts.length)];put(grid,w,o[0],o[1],o[2]);placed.push({a:w,c:ws[q][1],r:o[0],k:o[1],d:o[2]});}
    var mr=99,mc=99,xr=0,xc=0;for(var key in grid){var pr=key.split(",");mr=Math.min(mr,+pr[0]);mc=Math.min(mc,+pr[1]);xr=Math.max(xr,+pr[0]);xc=Math.max(xc,+pr[1]);}
    var sc=placed.length*10-((xr-mr+1)+(xc-mc+1));
    if(placed.length>=8&&(!best||sc>best.sc)){best={sc:sc,placed:placed,mr:mr,mc:mc,h:xr-mr+1,w:xc-mc+1};}
    if(best&&best.sc>=85)break;}
  if(!best)return cwGen();
  var words=best.placed.map(function(p){return {a:p.a,c:p.c,r:p.r-best.mr,k:p.k-best.mc,d:p.d};});
  var nums={},n=0;words.slice().sort(function(a,b){return a.r-b.r||a.k-b.k;}).forEach(function(w){var key=w.r+","+w.k;if(!nums[key]){n++;nums[key]=n;}w.n=nums[key];});
  return {h:best.h,w:best.w,words:words};
}
var CW=null;
function cwMap(){var m=[],r,k;for(r=0;r<CW.h;r++){m.push([]);for(k=0;k<CW.w;k++)m[r].push(null);}
  CW.words.forEach(function(w,i){for(var j=0;j<w.a.length;j++){var a=w.r+(w.d==="D"?j:0),b=w.k+(w.d==="A"?j:0);if(!m[a][b])m[a][b]={ch:w.a.charAt(j),ws:[],num:0};m[a][b].ws.push(i);if(j===0)m[a][b].num=w.n;}});return m;}
function vCross(){
  CW=cwGen();G.m=cwMap();G.cur=-1;G.cd="A";G.last=null;G.cwDone=false;
  var h=back("Palavras cruzadas","games")+'<div class="card" id="clue">Toque em um quadradinho para ver a dica. Pode apagar e escrever de novo quantas vezes quiser.</div><table class="cw">';
  for(var r=0;r<CW.h;r++){h+='<tr>';for(var k=0;k<CW.w;k++){var c=G.m[r][k];
    if(!c){h+='<td class="b"></td>';}else{h+='<td class="f" id="c'+r+'_'+k+'">'+(c.num?'<sup>'+c.num+'</sup>':'')+'<input autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" onpointerdown="G.wf=(document.activeElement===this)" onclick="cwTap('+r+','+k+')" onfocus="this.select();cwSel('+r+','+k+')" oninput="cwIn('+r+','+k+',this)" onkeydown="cwKey(event,'+r+','+k+')"></td>';}}
    h+='</tr>';}
  h+='</table><div style="display:flex;gap:10px"><button class="ghost" onclick="cwHint()">Dica</button><button class="primary" onclick="cwCheck()">Conferir</button></div>'+
   '<div style="display:flex;gap:10px;margin-top:10px"><button class="ghost" onclick="cwClear()">Apagar erradas</button><button class="ghost" onclick="go(\'cross\')">Novo jogo</button></div><div id="res" style="margin-top:12px"></div><div class="sp"></div>';
  var hz="",vt="";CW.words.slice().sort(function(a,b){return a.n-b.n;}).forEach(function(w){var l='<p><b>'+w.n+'.</b> '+w.c+' ('+w.a.length+' letras)</p>';if(w.d==="A")hz+=l;else vt+=l;});
  h+='<h3>Na horizontal</h3>'+hz+'<h3 style="margin-top:14px">Na vertical</h3>'+vt+foot();
  app.innerHTML=h;

function cwCell(r,k){return document.querySelector("#c"+r+"_"+k+" input");}
function cwSel(r,k,toggle){var c=G.m[r][k],idx=-1,i;
  for(i=0;i<c.ws.length;i++){if(CW.words[c.ws[i]].d===G.cd){idx=c.ws[i];break;}}
  if(toggle&&c.ws.length>1&&G.cur>=0&&c.ws.indexOf(G.cur)>=0){idx=c.ws[0]===G.cur?c.ws[1]:c.ws[0];}
  if(idx<0)idx=c.ws[0];
  G.cur=idx;G.cd=CW.words[idx].d;G.last={r:r,k:k};
  var all=document.querySelectorAll(".cw td.f");for(i=0;i<all.length;i++)all[i].classList.remove("hl");

function cwStep(r,k,delta){var w=CW.words[G.cur];if(!w)return;var j=(w.d==="A"?k-w.k:r-w.r)+delta;if(j<0||j>=w.a.length)return;
  var a=w.r+(w.d==="D"?j:0),b=w.k+(w.d==="A"?j:0),el=cwCell(a,b);if(el){el.focus();return {r:a,k:b};}}

function cwHint(){if(!G.last){document.getElementById("res").innerHTML='<p class="small">Toque primeiro em um quadradinho.</p>';return;}
  cwCell(G.last.r,G.last.k).value=G.m[G.last.r][G.last.k].ch;}
function cwClear(){var n=0;for(var r=0;r<CW.h;r++)for(var k=0;k<CW.w;k++){if(!G.m[r][k])continue;var td=document.getElementById("c"+r+"_"+k);if(td.classList.contains("no")){cwCell(r,k).value="";td.classList.remove("no");n++;}}
  document.getElementById("res").innerHTML='<p class="small">'+(n?"Apaguei as erradas. Pode escrever de novo.":"Não tem nenhuma errada marcada. Toque em Conferir primeiro.")+'</p>';}
function cwCheck(){var ok=0,tot=0;
  for(var r=0;r<CW.h;r++)for(var k=0;k<CW.w;k++){var c=G.m[r][k];if(!c)continue;tot++;var td=document.getElementById("c"+r+"_"+k),v=cwCell(r,k).value;td.classList.remove("ok","no");
    if(v){if(v===c.ch){ok++;td.classList.add("ok");}else{td.classList.add("no");}}}
  var res=document.getElementById("res");
  if(ok===tot){var first=!G.cwDone;if(first){G.cwDone=true;addPts(30);}
    res.innerHTML='<div class="card"><b>Completo!</b> '+(first?'Você ganhou 30 pontos.':'Os pontos já foram somados.')+'</div><button class="primary pulse" onclick="go(\'cross\')">Novo jogo</button><div class="sp"></div>'+contactBtn("Quero um app com jogos","Oi, Eve! Completei as palavras cruzadas e quero um app com jogos para o meu negócio.","ghost");}
  else{res.innerHTML='<div class="card">Certas: <b>'+ok+' de '+tot+'</b>. Verde está certo, vermelho está errado, e as vazias ainda faltam. Toque em "Apagar erradas" para tentar de novo.</div>';}}

function sendForm(){
  var n=document.getElementById("fn").value.trim(),w=document.getElementById("fw").value.replace(/\D/g,""),a=document.getElementById("fa").value,nd=document.getElementById("fneed").value,m=document.getElementById("fm").value.trim(),c=document.getElementById("fc").checked,e=document.getElementById("fe");
  if(!n){e.textContent="Escreva o seu nome.";return;}
  if(w.length<10){e.textContent="Confira o WhatsApp, com DDD.";return;}
  if(!c){e.textContent="Marque a caixinha para eu poder te chamar.";return;}
  var done_=function(msg){app.innerHTML='<h2>Recebi!</h2><div class="card"><p style="margin:0">'+msg+'</p></div><button class="primary" onclick="go(\'home\')">Voltar ao início</button>'+foot();window.scrollTo(0,0);};
  var txt="Oi, Eve! Sou "+n+" ("+a+"). Procuro: "+nd+"."+(m?" "+m:"")+" Meu WhatsApp: "+w;
  if(FORM.url){var fd=new FormData();fd.append(FORM.f.name,n);fd.append(FORM.f.whats,w);fd.append(FORM.f.area,a);fd.append(FORM.f.need,nd);if(FORM.f.msg)fd.append(FORM.f.msg,m);
    fetch(FORM.url,{method:"POST",mode:"no-cors",body:fd}).then(function(){done_("Seu contato chegou. Eu respondo pelo WhatsApp em breve.");}).catch(function(){window.open(waUrl(txt),"_blank");done_("Abri o seu WhatsApp com a mensagem pronta. É só enviar.");});
  }else{window.open(waUrl(txt),"_blank");done_("Abri o seu WhatsApp com a mensagem pronta. É só enviar.");}
}
